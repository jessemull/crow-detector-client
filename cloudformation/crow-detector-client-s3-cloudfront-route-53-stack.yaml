AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Critter Canteen static client — S3 + CloudFront + optional Route53.
  Environment=dev → buckets *-dev; Environment=prod → *-prod
  (matches live stacks and typical GitHub AWS_S3_BUCKET_* secrets).

Parameters:
  BucketName:
    Type: String
    Description: >-
      Base name for site/backup buckets (e.g. crow-detector-client).
      Site becomes ${BucketName}-dev|prod; backup ${BucketName}-backup-dev|prod.
  ACMCertificateArn:
    Type: String
    Description: The ARN of the ACM certificate for the CloudFront distribution (must be us-east-1).
  HostedZoneId:
    Type: String
    Description: The ID of the Route 53 hosted zone.
  CloudFrontHostedZoneId:
    Type: String
    Description: The Hosted Zone ID for CloudFront alias records (usually Z2FDTNDATAQYW2).
  Environment:
    Type: String
    Default: 'dev'
    Description: 'Logical environment (dev or prod). Controls DNS aliases and CI bucket suffixes.'
    AllowedValues:
      - dev
      - prod
    ConstraintDescription: "Must be either 'dev' or 'prod'."
  CreateDNSRecords:
    Type: String
    Default: 'true'
    Description: "Set to 'true' to create Route 53 DNS records. Set to 'false' to skip."
    AllowedValues:
      - 'true'
      - 'false'
  EnableSignedCookiesCheck:
    Type: String
    Description: "Set to 'true' to enable signed cookies (test CDN). Prod should be 'false'."
    AllowedValues:
      - 'true'
      - 'false'
  CloudFrontKeyGroupId:
    Type: String
    Description: 'Existing CloudFront Key Group ID for signed cookies (test only; leave empty for prod).'
    Default: ''

Mappings:
  EnvConfig:
    # Live account buckets: crow-detector-client-dev / crow-detector-client-prod
    dev:
      BucketSuffix: dev
    prod:
      BucketSuffix: prod

Conditions:
  IsProd: !Equals [!Ref Environment, 'prod']
  CreateDNSRecordTrue: !Equals [!Ref CreateDNSRecords, 'true']
  EnableSignedCookiesCheckCondition:
    !Equals [!Ref EnableSignedCookiesCheck, 'true']

Resources:
  StaticWebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub
        - '${Base}-${Suffix}'
        - Base: !Ref BucketName
          Suffix: !FindInMap [EnvConfig, !Ref Environment, BucketSuffix]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: true

  BackupBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub
        - '${Base}-backup-${Suffix}'
        - Base: !Ref BucketName
          Suffix: !FindInMap [EnvConfig, !Ref Environment, BucketSuffix]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldBackups
            Status: Enabled
            ExpirationInDays: 30
            Prefix: ''

  CloudFrontOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub 'CloudFront Origin Access Identity for the Crow Detector Client - ${Environment}'

  StaticWebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticWebsiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${CloudFrontOriginAccessIdentity}'
            Action: 's3:GetObject'
            Resource: !Sub
              - '${BucketArn}/*'
              - BucketArn: !GetAtt StaticWebsiteBucket.Arn

  CompressionCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub 'CompressionCachePolicyCrowDetectorClient-${Environment}'
        DefaultTTL: 31536000
        MinTTL: 86400
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub 'CloudFront distribution for Crow Detector Client - ${Environment}'
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt StaticWebsiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub 'origin-access-identity/cloudfront/${CloudFrontOriginAccessIdentity}'
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: !Ref CompressionCachePolicy
          Compress: true
          TrustedKeyGroups:
            Fn::If:
              - EnableSignedCookiesCheckCondition
              - [!Ref CloudFrontKeyGroupId]
              - !Ref 'AWS::NoValue'
          AllowedMethods:
            - GET
            - HEAD
        CustomErrorResponses: !If
          - EnableSignedCookiesCheckCondition
          - - ErrorCode: 404
              ResponseCode: 404
              ResponsePagePath: /404.html
              ErrorCachingMinTTL: 0
            - ErrorCode: 403
              ResponseCode: 403
              ResponsePagePath: /403.html
              ErrorCachingMinTTL: 0
          - - ErrorCode: 404
              ResponseCode: 404
              ResponsePagePath: /404.html
              ErrorCachingMinTTL: 0
            - ErrorCode: 403
              ResponseCode: 404
              ResponsePagePath: /404.html
              ErrorCachingMinTTL: 0
        Aliases:
          - !If
            - IsProd
            - 'www.crittercanteen.com'
            - 'www.dev.crittercanteen.com'
        ViewerCertificate:
          AcmCertificateArn: !Ref ACMCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  MainSiteRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateDNSRecordTrue
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !If
        - IsProd
        - 'www.crittercanteen.com'
        - 'www.dev.crittercanteen.com'
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: !Ref CloudFrontHostedZoneId

  RootDomainRedirect:
    Type: AWS::Route53::RecordSet
    Condition: CreateDNSRecordTrue
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !If
        - IsProd
        - 'crittercanteen.com'
        - 'dev.crittercanteen.com'
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: !Ref CloudFrontHostedZoneId

Outputs:
  CloudFrontDistributionId:
    Description: 'CloudFront Distribution ID'
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontDistributionId'

  CloudFrontDistributionDomainName:
    Description: 'CloudFront Distribution Domain Name'
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontDistributionDomainName'

  S3BucketName:
    Description: 'S3 Bucket Name (matches AWS_S3_BUCKET_DEV / _PROD)'
    Value: !Ref StaticWebsiteBucket
    Export:
      Name: !Sub '${AWS::StackName}-S3BucketName'

  BackupBucketName:
    Description: 'Backup S3 Bucket Name (matches AWS_S3_BUCKET_BACKUP_DEV / _PROD)'
    Value: !Ref BackupBucket
    Export:
      Name: !Sub '${AWS::StackName}-BackupBucketName'

  WebsiteURL:
    Description: 'Website URL'
    Value: !If
      - IsProd
      - 'https://www.crittercanteen.com'
      - 'https://www.dev.crittercanteen.com'
    Export:
      Name: !Sub '${AWS::StackName}-WebsiteURL'
