name: Rollback

on:
  workflow_dispatch:
    inputs:
      backup_s3_key:
        description: 'S3 key for the backup to restore, 14 digits such as 20250225083000'
        required: true
        type: string
      environment:
        description: 'Choose environment (test/production)'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: critter-canteen-site-deploy
  cancel-in-progress: false

jobs:
  rollback:
    name: Revert S3 Deployment
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ inputs.environment == 'test' && secrets.AWS_ROLE_TO_ASSUME_DEV || inputs.environment == 'production' && secrets.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Restore Selected Backup
        run: |
          case "$BACKUP_KEY" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *) echo "Backup key must be 14 digits"; exit 1 ;;
          esac
          if [ -z "$AWS_S3_BUCKET" ] || [ -z "$AWS_S3_BUCKET_BACKUP" ]; then
            echo "Refusing to roll back without both bucket names"
            exit 1
          fi
          if ! aws s3 ls "s3://$AWS_S3_BUCKET_BACKUP/$BACKUP_KEY/" | grep -q .; then
            echo "Refusing to restore an empty or missing backup"
            exit 1
          fi
          echo "Rolling back to $BACKUP_KEY"
          aws s3 sync "s3://$AWS_S3_BUCKET_BACKUP/$BACKUP_KEY/" "s3://$AWS_S3_BUCKET" --delete --exclude "data/*"
        env:
          BACKUP_KEY: ${{ inputs.backup_s3_key }}
          AWS_S3_BUCKET: ${{ inputs.environment == 'test' && secrets.AWS_S3_BUCKET_DEV || inputs.environment == 'production' && secrets.AWS_S3_BUCKET_PROD }}
          AWS_S3_BUCKET_BACKUP: ${{ inputs.environment == 'test' && secrets.AWS_S3_BUCKET_BACKUP_DEV || inputs.environment == 'production' && secrets.AWS_S3_BUCKET_BACKUP_PROD }}

      - name: Invalidate CloudFront Cache
        run: |
          invalidation_id="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*" --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$invalidation_id"
        env:
          DISTRIBUTION: ${{ inputs.environment == 'test' && secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID_DEV || inputs.environment == 'production' && secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID_PROD }}
